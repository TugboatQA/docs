name: Security

on:
  pull_request:
    paths:
      - ".github/**"

permissions: {}

jobs:
  zizmor:
    name: Run Zizmor Security Analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zizmor
        run: pip install zizmor==1.30.1

      - name: Run Zizmor
        run: zizmor .github
