name: prettier

on:
  - push
  - pull_request

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - name: yarn install
        run: yarn install --frozen-lockfile
      - name: yarn lint
        # Runs the Prettier version pinned in yarn.lock against all Markdown files.
        run: yarn lint
