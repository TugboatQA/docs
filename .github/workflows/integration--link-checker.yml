name: link-checker

# Called by integration.yml as part of the "Integration" required status check.

on:
  workflow_call:

permissions: {}

jobs:
  link-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.147.8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: install hugo
        # Download from gohugoio/hugo releases and verify against the published checksums.
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -sLo "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sLo "hugo_checksums.txt" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "hugo_checksums.txt"
          tar -C "${HOME}/.local/bin" -xf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          rm "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" "hugo_checksums.txt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: build hugo
        run: hugo
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: yarn
      - name: yarn install
        run: yarn install --frozen-lockfile
      - name: yarn test
        run: yarn test
