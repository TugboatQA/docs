name: Static code analysis

# Every job in this workflow is part of the "Static code analysis" required status check. Add new linters as jobs here
# and list them in the "needs" of the gate job; branch protection does not need to change.

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
      - name: yarn install
        run: yarn install --frozen-lockfile
      - name: yarn lint
        # Runs the Prettier version pinned in yarn.lock against all Markdown files.
        run: yarn lint

  static-code-analysis:
    # The required status check for branch protection. It runs even when a job it needs fails or is skipped, and fails
    # if any of those jobs failed or was cancelled. A skipped job counts as passing.
    name: Static code analysis
    if: always()
    needs: [prettier]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              exit 1
            fi
          done
