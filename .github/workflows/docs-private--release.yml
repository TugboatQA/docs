name: Release to docs

# Runs in TugboatQA/docs-private only. It lives in this repo so the "Mirror to docs-private" workflow copies it there.
# Run it by hand from main to release a version branch, which holds the documentation for one TugboatQA/tugboat
# release, for example v2.26.47. It pushes the version branch to a branch with the same name on TugboatQA/docs and
# opens a pull request from it into main. The commits are public as soon as the branch is pushed. With "dry_run"
# checked, it lists the commits the release would publish and pushes nothing.
#
# Pushes with a token for the GitHub App in the DOCS_PRIVATE_APP_CLIENT_ID and DOCS_PRIVATE_APP_PRIVATE_KEY secrets.
# The helper script comes from TugboatQA/docs main, not from the version branch, so code on a version branch that has
# not been reviewed in TugboatQA/docs does not run with that token.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version branch to release, for example v2.26.47.
        type: string
        required: true
      dry_run:
        description: List the commits the release would publish, and push nothing.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-to-docs
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'TugboatQA/docs-private' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the helper script from TugboatQA/docs main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TugboatQA/docs
          ref: main
          path: docs
          sparse-checkout: .github/helpers
          persist-credentials: false
      - name: Check out the version branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          path: docs-private
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: ${{ !inputs.dry_run }}
        id: app-token
        with:
          client-id: ${{ secrets.DOCS_PRIVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_PRIVATE_APP_PRIVATE_KEY }}
          owner: TugboatQA
          repositories: docs
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Check the version branch, push it, and open the pull request
        working-directory: docs-private
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: ../docs/.github/helpers/docs-private-release.sh
