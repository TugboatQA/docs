name: Integration

# Every job in this workflow is part of the "Integration" required status check. Path filtering happens at the job
# level, not the trigger level, so the "Integration" gate job reports a result on every pull request.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            schema:
              - '.github/workflows/integration.yml'
              - 'static/config-schema.json'

  link-checker:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.8

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: install hugo
        # Download from gohugoio/hugo releases and verify against the published checksums.
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -sLo "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sLo "hugo_checksums.txt" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "hugo_checksums.txt"
          tar -C "${HOME}/.local/bin" -xf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          rm "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" "hugo_checksums.txt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: build hugo
        run: hugo
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
      - name: yarn install
        run: yarn install --frozen-lockfile
      - name: yarn test
        run: yarn test

  validate-configs:
    # Validate TugboatQA/tugboat-test configs against the schema when the schema changes.
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout schema repository
        uses: actions/checkout@v7
        with:
          path: schema-repo

      - name: Checkout test repository
        uses: actions/checkout@v7
        with:
          repository: TugboatQA/tugboat-test
          path: test-repo
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install ajv-cli
        run: |
          npm install -g ajv-cli@5.0.0

      - name: Validate configs
        working-directory: test-repo
        run: |
          # Get all remote branches
          git ls-remote --heads https://github.com/TugboatQA/tugboat-test.git | sed 's|^.*refs/heads/||' | while read -r branch; do
            echo "::group::Checking branch: $branch"

            # Checkout branch
            git checkout "$branch"

            # If config.yml exists, validate it
            if [ -f .tugboat/config.yml ]; then
              echo "Validating config.yml in branch $branch"
              if [ "$branch" = "yaml-fail" ] || [ "$branch" = "invalid-yaml" ]; then
                # For yaml-fail and invalid-yaml branches, we expect validation to fail
                if ajv validate --all-errors -s ../schema-repo/static/config-schema.json -d .tugboat/config.yml; then
                  echo "::error::Branch $branch was expected to fail validation but passed"
                  exit 1
                else
                  echo "Branch $branch failed validation as expected"
                fi
              else
                # For all other branches, validation should pass
                if ! ajv validate --all-errors -s ../schema-repo/static/config-schema.json -d .tugboat/config.yml; then
                  echo "::error::Schema validation failed for branch $branch"
                  exit 1
                fi
              fi
            else
              echo "::warning::No config.yml found in branch $branch"
            fi
            echo "::endgroup::"
          done

  integration:
    # The required status check for branch protection. It runs even when a job it needs fails or is skipped, and fails
    # if any of those jobs failed or was cancelled. A skipped job counts as passing.
    name: Integration
    if: always()
    needs: [changes, link-checker, validate-configs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              exit 1
            fi
          done
