name: Integration

# Every job in this workflow is part of the "Integration" required status check. Each test lives in its own
# integration--*.yml workflow, called here with workflow_call. Path filtering happens at the job level, not the trigger
# level, so the "Integration" gate job reports a result on every pull request.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            schema:
              - '.github/workflows/integration.yml'
              - '.github/workflows/integration--validate-configs.yml'
              - 'static/config-schema.json'

  link-checker:
    permissions:
      contents: read
    uses: $/.github/workflows/integration--link-checker.yml

  validate-configs:
    # Validate TugboatQA/tugboat-test configs against the schema when the schema changes.
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.schema == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/integration--validate-configs.yml

  integration:
    # The required status check for branch protection. It runs even when a job it needs fails or is skipped, and fails
    # if any of those jobs failed or was cancelled. A skipped job counts as passing.
    name: Integration
    if: always()
    needs: [changes, link-checker, validate-configs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              exit 1
            fi
          done
